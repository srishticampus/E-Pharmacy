<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .doctor-card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .doctor-card:hover {
            transform: scale(1.02);
        }
        .doctor-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="text-center mb-5">All Registered Doctors</h2>
        <div class="row">
            {% for doctor in doctors %}
            <div class="col-md-4 mb-4">
                <div class="card doctor-card">
                    {% if doctor.image %}
                        <img src="{{ doctor.image.url }}" alt="Doctor Image" class="doctor-img">
                    {% else %}
                        <img src="https://via.placeholder.com/400x250.png?text=No+Image" class="doctor-img" alt="No Image">
                    {% endif %}
                    <div class="card-body text-center">
                        <h5 class="card-title">Dr. {{ doctor.user.first_name }} {{ doctor.user.last_name }}</h5>
                        <p class="card-text"><strong>Specialization:</strong> {{ doctor.specialization }}</p>
                        <p class="card-text"><strong>Phone:</strong> {{ doctor.phone_number }}</p>
                        <a href="{% url 'doctor_detail' doctor.id %}" class="btn btn-outline-primary btn-sm">View Profile</a>
                    </div>
                </div>
            </div>
            {% empty %}
                <p>No doctors available.</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
