<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1605902711622-cfb43c4437d4') no-repeat center center fixed;
            background-size: cover;
        }
        .payment-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            margin: 50px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .payment-method {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 15px;
            transition: border-color 0.3s;
        }
        .payment-method:hover {
            border-color: #007bff;
        }
        .payment-method input[type="radio"] {
            display: none;
        }
        .payment-method.selected {
            border-color: #007bff;
            background-color: #e9f5ff;
        }
        .payment-method img {
            width: 50px;
            height: auto;
        }
        .conditional-fields {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container payment-container">
        <h2 class="text-center mb-4">Complete Your Payment</h2>
        <p class="text-center mb-4">Total Payable: <strong>${{ total }}</strong></p>
        <form method="post" action="{% url 'payment_success' %}">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label">Select Payment Method:</label>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="payment-method d-flex flex-column align-items-center" onclick="selectPaymentMethod(this)">
                            <input type="radio" name="payment_method" value="gpay">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Google_Pay_Logo.svg" alt="GPay">
                            <span class="mt-2">GPay</span>
                        </label>
                    </div>
                    <div class="col-md-4">
                        <label class="payment-method d-flex flex-column align-items-center" onclick="selectPaymentMethod(this)">
                            <input type="radio" name="payment_method" value="cod">
                            <img src="https://cdn-icons-png.flaticon.com/512/263/263115.png" alt="Cash on Delivery">
                            <span class="mt-2">Cash on Delivery</span>
                        </label>
                    </div>
                    <div class="col-md-4">
                        <label class="payment-method d-flex flex-column align-items-center" onclick="selectPaymentMethod(this)">
                            <input type="radio" name="payment_method" value="card">
                            <img src="https://cdn-icons-png.flaticon.com/512/633/633611.png" alt="Card">
                            <span class="mt-2">Credit/Debit Card</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Conditional Fields -->
            <div id="gpay-fields" class="conditional-fields">
                <div class="mb-3">
                    <label for="gpay-phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="gpay-phone" name="gpay_phone" placeholder="Enter your phone number">
                </div>
            </div>

            <div id="cod-fields" class="conditional-fields">
                <div class="mb-3">
                    <label for="cod-address" class="form-label">Delivery Address</label>
                    <textarea class="form-control" id="cod-address" name="cod_address" rows="3" placeholder="Enter your delivery address"></textarea>
                </div>
            </div>

            <div id="card-fields" class="conditional-fields">
                <div class="mb-3">
                    <label for="card-number" class="form-label">Card Number</label>
                    <input type="text" class="form-control" id="card-number" name="card_number" placeholder="Enter your card number">
                </div>
                <div class="mb-3">
                    <label for="card-expiry" class="form-label">Expiry Date</label>
                    <input type="text" class="form-control" id="card-expiry" name="card_expiry" placeholder="MM/YY">
                </div>
                <div class="mb-3">
                    <label for="card-cvv" class="form-label">CVV</label>
                    <input type="text" class="form-control" id="card-cvv" name="card_cvv" placeholder="CVV">
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">Pay Now</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS and dependencies (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selectPaymentMethod(element) {
            const methods = document.querySelectorAll('.payment-method');
            methods.forEach(method => method.classList.remove('selected'));
            element.classList.add('selected');
            element.querySelector('input[type="radio"]').checked = true;

            // Hide all conditional fields
            document.querySelectorAll('.conditional-fields').forEach(field => field.style.display = 'none');

            // Show relevant fields
            const selectedValue = element.querySelector('input[type="radio"]').value;
            if (selectedValue === 'gpay') {
                document.getElementById('gpay-fields').style.display = 'block';
            } else if (selectedValue === 'cod') {
                document.getElementById('cod-fields').style.display = 'block';
            } else if (selectedValue === 'card') {
                document.getElementById('card-fields').style.display = 'block';
            }
        }
    </script>
</body>
</html>
